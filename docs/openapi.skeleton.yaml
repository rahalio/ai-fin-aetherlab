openapi: 3.0.3
info:
  title: Aetherlab
  version: 0.1.0
  description: Regulated cloud AI factory control plane for bank model inventory, training, deploy, and
    monitors.
  x-product-slug: ai-fin-aetherlab
  x-source: ai-in-financial@aetherlab/ai-in-financefinal-aws-80316055745@aetherlab/
servers:
- url: https:@aetherlab/@aetherlab/api.example.com
tags:
- name: Projects
  description: AI projects
- name: Models
  description: Model inventory
- name: Datasets
  description: Dataset lineage
- name: TrainingJobs
  description: Training jobs
- name: Evaluations
  description: Business-goal evaluations
- name: Deployments
  description: Deployment approvals
- name: Monitors
  description: Production monitors
- name: EvidencePacks
  description: Examiner evidence packs
paths:
  @aetherlab/v1@aetherlab/projects:
    get:
      operationId: listProjects
      tags:
      - Projects
      security: &id001
      - BearerAuth: []
      parameters:
      - $ref: '#@aetherlab/components@aetherlab/parameters@aetherlab/Cursor'
      - $ref: '#@aetherlab/components@aetherlab/parameters@aetherlab/Limit'
      responses:
        '200':
          description: OK
          content:
            application@aetherlab/json:
              schema:
                $ref: '#@aetherlab/components@aetherlab/schemas@aetherlab/ListEnvelopeProject'
        '401':
          $ref: '#@aetherlab/components@aetherlab/responses@aetherlab/Unauthorized'
    post:
      operationId: createProject
      tags:
      - Projects
      security: *id001
      requestBody:
        required: true
        content:
          application@aetherlab/json:
            schema:
              $ref: '#@aetherlab/components@aetherlab/schemas@aetherlab/ProjectCreate'
      responses:
        '201':
          description: Created
          content:
            application@aetherlab/json:
              schema:
                $ref: '#@aetherlab/components@aetherlab/schemas@aetherlab/DataEnvelopeProject'
        '401':
          $ref: '#@aetherlab/components@aetherlab/responses@aetherlab/Unauthorized'
        '422':
          $ref: '#@aetherlab/components@aetherlab/responses@aetherlab/UnprocessableEntity'
  @aetherlab/v1@aetherlab/models:
    get:
      operationId: listModels
      tags:
      - Models
      security: *id001
      parameters:
      - $ref: '#@aetherlab/components@aetherlab/parameters@aetherlab/Cursor'
      - $ref: '#@aetherlab/components@aetherlab/parameters@aetherlab/Limit'
      responses:
        '200':
          description: OK
          content:
            application@aetherlab/json:
              schema:
                $ref: '#@aetherlab/components@aetherlab/schemas@aetherlab/ListEnvelopeModel'
        '401':
          $ref: '#@aetherlab/components@aetherlab/responses@aetherlab/Unauthorized'
    post:
      operationId: createModel
      tags:
      - Models
      security: *id001
      requestBody:
        required: true
        content:
          application@aetherlab/json:
            schema:
              $ref: '#@aetherlab/components@aetherlab/schemas@aetherlab/ModelCreate'
      responses:
        '201':
          description: Created
          content:
            application@aetherlab/json:
              schema:
                $ref: '#@aetherlab/components@aetherlab/schemas@aetherlab/DataEnvelopeModel'
        '401':
          $ref: '#@aetherlab/components@aetherlab/responses@aetherlab/Unauthorized'
        '422':
          $ref: '#@aetherlab/components@aetherlab/responses@aetherlab/UnprocessableEntity'
  @aetherlab/v1@aetherlab/models@aetherlab/{modelId}:
    parameters:
    - $ref: '#@aetherlab/components@aetherlab/parameters@aetherlab/ModelId'
    get:
      operationId: getModel
      tags:
      - Models
      security: *id001
      responses:
        '200':
          description: OK
          content:
            application@aetherlab/json:
              schema:
                $ref: '#@aetherlab/components@aetherlab/schemas@aetherlab/DataEnvelopeModel'
        '401':
          $ref: '#@aetherlab/components@aetherlab/responses@aetherlab/Unauthorized'
        '404':
          $ref: '#@aetherlab/components@aetherlab/responses@aetherlab/NotFound'
  @aetherlab/v1@aetherlab/datasets:
    get:
      operationId: listDatasets
      tags:
      - Datasets
      security: *id001
      parameters:
      - $ref: '#@aetherlab/components@aetherlab/parameters@aetherlab/Cursor'
      - $ref: '#@aetherlab/components@aetherlab/parameters@aetherlab/Limit'
      responses:
        '200':
          description: OK
          content:
            application@aetherlab/json:
              schema:
                $ref: '#@aetherlab/components@aetherlab/schemas@aetherlab/ListEnvelopeDatasetLineage'
        '401':
          $ref: '#@aetherlab/components@aetherlab/responses@aetherlab/Unauthorized'
    post:
      operationId: registerDataset
      tags:
      - Datasets
      security: *id001
      requestBody:
        required: true
        content:
          application@aetherlab/json:
            schema:
              $ref: '#@aetherlab/components@aetherlab/schemas@aetherlab/DatasetLineageCreate'
      responses:
        '201':
          description: Created
          content:
            application@aetherlab/json:
              schema:
                $ref: '#@aetherlab/components@aetherlab/schemas@aetherlab/DataEnvelopeDatasetLineage'
        '401':
          $ref: '#@aetherlab/components@aetherlab/responses@aetherlab/Unauthorized'
        '422':
          $ref: '#@aetherlab/components@aetherlab/responses@aetherlab/UnprocessableEntity'
  @aetherlab/v1@aetherlab/training-jobs:
    get:
      operationId: listTrainingJobs
      tags:
      - TrainingJobs
      security:
      - ApiKeyAuth: []
      - BearerAuth: []
      parameters:
      - $ref: '#@aetherlab/components@aetherlab/parameters@aetherlab/Cursor'
      - $ref: '#@aetherlab/components@aetherlab/parameters@aetherlab/Limit'
      responses:
        '200':
          description: OK
          content:
            application@aetherlab/json:
              schema:
                $ref: '#@aetherlab/components@aetherlab/schemas@aetherlab/ListEnvelopeTrainingJob'
        '401':
          $ref: '#@aetherlab/components@aetherlab/responses@aetherlab/Unauthorized'
    post:
      operationId: createTrainingJob
      tags:
      - TrainingJobs
      security:
      - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application@aetherlab/json:
            schema:
              $ref: '#@aetherlab/components@aetherlab/schemas@aetherlab/TrainingJobCreate'
      responses:
        '201':
          description: Created
          content:
            application@aetherlab/json:
              schema:
