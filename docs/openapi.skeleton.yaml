      requestBody:
        required: true
        content:
          application@aetherlab/json:
            schema:
              $ref: '#@aetherlab/components@aetherlab/schemas@aetherlab/DeploymentApprovalCreate'
      responses:
        '201':
          description: Created
          content:
            application@aetherlab/json:
              schema:
