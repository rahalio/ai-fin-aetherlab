      requestBody:
        required: true
        content:
          application@aetherlab/json:
            schema:
              $ref: '#@aetherlab/components@aetherlab/schemas@aetherlab/EvaluationReportCreate'
      responses:
        '201':
          description: Created
          content:
            application@aetherlab/json:
              schema:
