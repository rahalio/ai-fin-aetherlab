components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    Cursor:
      name: cursor
      in: query
      schema:
        type: string
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    ModelId:
      name: modelId
      in: path
      required: true
      schema:
        type: string
  responses:
    Unauthorized:
      description: Unauthorized
      content:
        application@aetherlab/json:
          schema:
            $ref: '#@aetherlab/components@aetherlab/schemas@aetherlab/Problem'
    NotFound:
      description: Not found
      content:
        application@aetherlab/json:
          schema:
            $ref: '#@aetherlab/components@aetherlab/schemas@aetherlab/Problem'
    UnprocessableEntity:
      description: Unprocessable entity
      content:
        application@aetherlab/json:
          schema:
            $ref: '#@aetherlab/components@aetherlab/schemas@aetherlab/Problem'
  schemas:
    ResponseMeta:
      type: object
      required:
      - requestId
      - timestamp
      properties:
        requestId:
          type: string
        timestamp:
          type: string
          format: date-time
    Problem:
      type: object
      required:
      - type
      - title
      - status
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
    Project:
      type: object
      required:
      - id
      - name
      - owner
      - riskClass
      - status
      properties:
        id:
          type: string
        name:
          type: string
        owner:
          type: string
        riskClass:
          type: string
          enum:
          - low
          - credit
          - aml
          - trading
          - adverse_action
        status:
          type: string
          enum:
          - active
          - archived
    ProjectCreate:
      type: object
      required:
      - name
      - owner
      - riskClass
      - problemStatement
      properties:
        name:
          type: string
        owner:
          type: string
        riskClass:
          type: string
          enum:
          - low
          - credit
          - aml
          - trading
          - adverse_action
        problemStatement:
          type: string
    Model:
      type: object
      required:
      - id
      - projectId
      - name
      - status
      properties:
        id:
          type: string
        projectId:
          type: string
        name:
          type: string
        status:
          type: string
          enum:
          - draft
          - trained
          - approved
          - deployed
          - retired
    ModelCreate:
      type: object
      required:
      - projectId
      - name
      properties:
        projectId:
          type: string
        name:
          type: string
        baseModelZooId:
          type: string
    DatasetLineage:
      type: object
      required:
      - id
      - projectId
      - sourceSystem
      - purpose
      properties:
        id:
          type: string
        projectId:
          type: string
        sourceSystem:
          type: string
        extractedAt:
          type: string
          format: date-time
        purpose:
          type: string
        locationUri:
          type: string
    DatasetLineageCreate:
      type: object
      required:
      - projectId
      - sourceSystem
      - purpose
      - locationUri
      properties:
        projectId:
          type: string
        sourceSystem:
          type: string
        extractedAt:
          type: string
          format: date-time
        purpose:
          type: string
        locationUri:
          type: string
    TrainingJob:
      type: object
      required:
      - id
      - modelId
      - status
      properties:
        id:
          type: string
        modelId:
          type: string
        datasetId:
          type: string
        status:
          type: string
          enum:
          - queued
          - running
          - succeeded
          - failed
        costUsd:
          type: number
    TrainingJobCreate:
      type: object
      required:
      - modelId
      - datasetId
      properties:
        modelId:
          type: string
        datasetId:
          type: string
        computeProfile:
          type: string
    EvaluationReport:
      type: object
      required:
      - id
      - modelId
      - businessGoalMet
      properties:
        id:
          type: string
        modelId:
          type: string
        businessGoalMet:
          type: boolean
        metrics:
          type: object
          additionalProperties:
            type: number
        notes:
          type: string
    EvaluationReportCreate:
      type: object
      required:
      - modelId
      - businessGoalMet
      - metrics
      properties:
        modelId:
          type: string
        businessGoalMet:
          type: boolean
        metrics:
          type: object
          additionalProperties:
            type: number
        notes:
          type: string
    DeploymentApproval:
      type: object
      required:
      - id
      - modelId
      - status
      properties:
        id:
          type: string
        modelId:
          type: string
        endpointName:
          type: string
        status:
          type: string
          enum:
          - pending
          - approved
          - rejected
        validatorId:
          type: string
    DeploymentApprovalCreate:
      type: object
      required:
      - modelId
      - endpointName
      - monitorIds
      properties:
        modelId:
          type: string
        endpointName:
          type: string
        monitorIds:
          type: array
          items:
            type: string
    Monitor:
      type: object
      required:
      - id
      - modelId
      - metric
      - status
      properties:
        id:
          type: string
        modelId:
          type: string
        metric:
          type: string
        threshold:
          type: number
        status:
          type: string
          enum:
          - healthy
          - breached
          - disabled
    MonitorCreate:
      type: object
      required:
      - modelId
      - metric
      - threshold
      properties:
        modelId:
          type: string
        metric:
          type: string
        threshold:
          type: number
    EvidencePack:
      type: object
      required:
      - id
      - modelId
      properties:
        id:
          type: string
        modelId:
          type: string
        downloadUrl:
          type: string
          format: uri
    DataEnvelopeProject:
      type: object
      required:
      - data
      - meta
      properties:
        data:
          $ref: '#@aetherlab/components@aetherlab/schemas@aetherlab/Project'
        meta:
          $ref: '#@aetherlab/components@aetherlab/schemas@aetherlab/ResponseMeta'
    ListEnvelopeProject:
      type: object
      required:
      - data
      - meta
      properties:
        data:
          type: object
          required:
          - items
          properties:
            items:
              type: array
              items:
                $ref: '#@aetherlab/components@aetherlab/schemas@aetherlab/Project'
            nextCursor:
              type: string
        meta:
          $ref: '#@aetherlab/components@aetherlab/schemas@aetherlab/ResponseMeta'
    DataEnvelopeModel:
      type: object
      required:
      - data
      - meta
      properties:
