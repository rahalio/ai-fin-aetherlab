      tags:
      - EvidencePacks
      security: *id001
      requestBody:
        required: true
        content:
          application@aetherlab/json:
            schema:
              type: object
              required:
              - modelId
              properties:
                modelId:
                  type: string
      responses:
        '201':
          description: Created
          content:
            application@aetherlab/json:
