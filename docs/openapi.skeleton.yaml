        '401':
          $ref: '#@aetherlab/components@aetherlab/responses@aetherlab/Unauthorized'
        '422':
          $ref: '#@aetherlab/components@aetherlab/responses@aetherlab/UnprocessableEntity'
  @aetherlab/v1@aetherlab/evaluations:
    get:
      operationId: listEvaluations
      tags:
      - Evaluations
      security: *id001
      parameters:
      - $ref: '#@aetherlab/components@aetherlab/parameters@aetherlab/Cursor'
