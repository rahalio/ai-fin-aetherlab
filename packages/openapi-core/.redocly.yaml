apis:
  identity:
    root: src/identity.yaml
  projects:
    root: src/projects.yaml
  models:
    root: src/models.yaml
  datasets:
    root: src/datasets.yaml
  trainingjobs:
    root: src/trainingjobs.yaml
  evaluations:
    root: src/evaluations.yaml
  deployments:
    root: src/deployments.yaml
  monitors:
    root: src/monitors.yaml
  evidencepacks:
    root: src/evidencepacks.yaml

extends:
  - recommended

rules:
  no-unused-components: off
  operation-4xx-response: warn
  info-license: off
  info-license-url: off
  tag-description: off
  operation-operationId: error
  no-invalid-media-type-examples: off

theme:
  openapi:
    generateCodeSamples:
      languages: []
